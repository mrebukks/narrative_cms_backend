<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Source+Serif+4:ital,wght@0,600;0,700;1,400&display=swap" />

    <style>
      :root {
        /* Colors */
        --color-primary: #004ac6;
        --color-primary-hover: #003ea8;
        --color-secondary: #565e74;
        --color-on-surface: #191b23;
        --color-background: #faf8ff;
        --color-outline: #c3c6d7;
        --color-outline-variant: #e1e2ed;
        --color-error: #ba1a1a;

        /* Typography */
        --font-body: "Inter", sans-serif;
        --font-display: "Source Serif 4", serif;

        /* Spacing */
        --spacing-sm: 8px;
        --spacing-md: 16px;
        --spacing-lg: 32px;
        --spacing-xl: 48px;
        --container-width: 640px;
      }

      body {
        background-color: var(--color-background);
        color: var(--color-on-surface);
        font-family: var(--font-body);
        line-height: 1.6;
        padding: var(--spacing-xl) var(--spacing-md);
      }

      .hidden {
        display: none;
      }

      .dashboard-container {
        max-width: var(--container-width);
        margin: 0 auto;
      }

      .cms-header {
        text-align: center;
        margin-bottom: var(--spacing-xl);
      }

      .brand-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-sm);
        margin-bottom: var(--spacing-sm);
      }

      .brand-logo .material-symbols-outlined {
        color: var(--color-primary);
        font-variation-settings: "FILL" 1;
      }

      .brand-name {
        font-family: var(--font-display);
        font-size: 24px;
        font-weight: 700;
      }

      .brand-subtitle {
        font-size: 12px;
        color: var(--color-secondary);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-weight: 600;
      }

      /* Form section */
      .section-title {
        font-family: var(--font-display);
        font-size: 20px;
        margin-bottom: var(--spacing-md);
        font-weight: 600;
      }

      .cms-form {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .form-label {
        font-size: 14px;
        font-weight: 600;
      }

      .form-input,
      .form-textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--color-outline);
        border-radius: 2px;
        font-family: var(--font-body);
        font-size: 16px;
        background: white;
      }

      .form-input:focus,
      .form-textarea:focus {
        outline: 2px solid var(--color-primary);
        outline-offset: -1px;
      }

      .btn-submit {
        background: var(--color-primary);
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        align-self: flex-start;
        transition: background 0.2s ease;
      }

      .btn-submit:hover {
        background: var(--color-primary-hover);
      }

      .linkContainer .loginForm {
        text-decoration: none;
        padding: var(--spacing-sm);
      }

      .linkContainer {
        padding-top: var(--spacing-md);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Branding -->
      <header class="cms-header">
        <div class="brand-logo">
          <span class="material-symbols-outlined">auto_stories</span>
          <h1 class="brand-name">The Narrative</h1>
        </div>
        <p class="brand-subtitle">Editorial CMS</p>
      </header>

      <section id="authSection">
        <h2 class="section-title">Sign Up</h2>
        <form id="regForm" class="cms-form">
          <div class="form-group">
            <label class="form-label" for="regName">Your Name</label>
            <input
              type="text"
              class="form-input"
              name="name"
              id="loginName"
              required
              placeholder="pls enter your name" />
            <label class="form-label" for="regEmail">Email Address</label>
            <input
              class="form-input"
              name="email"
              id="loginEmail"
              type="email"
              required
              placeholder="editor@thenarrative.com" />
          </div>
          <div class="form-group">
            <label class="form-label" for="regPassword">Password</label>
            <input
              class="form-input"
              name="password"
              id="loginPassword"
              type="password"
              required
              placeholder="••••••••" />
          </div>
          <button class="btn-submit" type="submit">Register</button>
        </form>
        <div class="linkContainer">
          <span>Have an Account?</span>
          <a href="index.html" class="loginForm"> • Login Here .</a>
        </div>
      </section>

      <section id="token" class="hidden">
        <form id="tokenForm" class="cms-form">
          <div class="form-group">
            <label class="form-label" for="tokenEmail">Email Address</label>
            <input
              class="form-input"
              id="tokenEmail"
              type="email"
              required
              placeholder="editor@thenarrative.com" />
          </div>
          <div class="form-group">
            <label class="form-label" for="regPassword">token</label>
            <input class="form-input" id="tokenPassword" type="text" require />
          </div>
          <button class="btn-submit" type="submit">Register</button>
        </form>
      </section>
    </div>
    <script>
      const form = document.getElementById("regForm");
      const authSection = document.getElementById("authSection");
      const tokenSection = document.getElementById("token");
      const tokenForm = document.getElementById("tokenForm");
      const loginName = document.getElementById("loginName");
      const loginEmail = document.getElementById("loginEmail");
      const loginPassword = document.getElementById("loginPassword");
      const tokenEmail = document.getElementById("tokenEmail");
      const tokenPassword = document.getElementById("tokenPassword");

      const url = "/register";
      const tokenUrl = "/verification";

      //  form for Registering.
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          const name = loginName.value;
          const email = loginEmail.value;
          const password = loginPassword.value;

          console.log(name, email);

          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json", // <-- ADD THIS
            },
            body: JSON.stringify({
              name: name,
              email: email,
              password: password,
            }),
          });

          const data = await response.json();
          console.log("data: ", data);

          if (response.ok) {
            alert("Almost Registered! check your email for verification");

            // prevent the user from retyping their email
            tokenEmail.value = email;

            authSection.classList.add("hidden");
            tokenSection.classList.remove("hidden");
          } else {
            alert(
              data.error || "error something is wrong with the details entered",
            );
          }
        } catch (error) {
          alert(error);
        }
      });

      // form for sending token to the email.
      tokenForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          // grab the form details
          const email = tokenEmail.value;
          const token = tokenPassword.value;

          if (!email || !token) {
            return;
          }

          const response = await fetch(tokenUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json", // <-- ADD THIS
            },
            body: JSON.stringify({ email: email, token: token }),
          });

          const data = await response;
          console.log(data);

          if (response.ok) {
            alert(data.message || "Registration Successful ✅");
            window.location.href = "/index.html";
          } else {
            alert(data.message || "something went wrong ❌");
          }
        } catch (error) {
          console.log(error);
        }
      });
    </script>
  </body>
</html>

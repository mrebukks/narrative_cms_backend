<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Source+Serif+4:ital,wght@0,600;0,700;1,400&display=swap" />

    <style>
      :root {
        /* Colors */
        --color-primary: #004ac6;
        --color-primary-hover: #003ea8;
        --color-secondary: #565e74;
        --color-on-surface: #191b23;
        --color-background: #faf8ff;
        --color-outline: #c3c6d7;
        --color-outline-variant: #e1e2ed;
        --color-error: #ba1a1a;

        /* Typography */
        --font-body: "Inter", sans-serif;
        --font-display: "Source Serif 4", serif;

        /* Spacing */
        --spacing-sm: 8px;
        --spacing-md: 16px;
        --spacing-lg: 32px;
        --spacing-xl: 48px;
        --container-width: 640px;
      }

      body {
        background-color: var(--color-background);
        color: var(--color-on-surface);
        font-family: var(--font-body);
        line-height: 1.6;
        padding: var(--spacing-xl) var(--spacing-md);
      }

      .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 2000;
        padding: 0 16px;
      }

      .toast {
        min-width: 300px;
        max-width: 420px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow:
          0 8px 32px rgba(15, 23, 42, 0.12),
          inset 1px 1px 0 rgba(255, 255, 255, 0.5);
        border-left: 6px solid #1d4ed8;
        transform: translateX(30px);
        opacity: 0;
        transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
      }

      @media (max-width: 640px) {
        .toast-container {
          top: auto;
          bottom: 20px;
          right: 12px;
          left: 12px;
          gap: 10px;
          padding: 0;
        }

        .toast {
          min-width: unset;
          max-width: unset;
          width: 100%;
          padding: 12px 14px;
          border-radius: 14px;
          gap: 10px;
          font-size: 14px;
        }

        .toast-icon {
          width: 26px;
          height: 26px;
          font-size: 14px;
        }

        .toast-content strong {
          font-size: 10px;
        }

        .toast-content span {
          font-size: 13px;
        }

        .toast-close {
          font-size: 18px;
        }
      }

      .toast.show {
        transform: translateX(0);
        opacity: 1;
      }

      .toast-success {
        border-left-color: #1f9d61;
      }

      .toast-error {
        border-left-color: #d64545;
      }

      .toast-info {
        border-left-color: #1d4ed8;
      }

      .toast-icon {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: white;
        font-weight: 700;
        background: linear-gradient(135deg, #1d4ed8, #2563eb);
      }

      .toast-success .toast-icon {
        background: linear-gradient(135deg, #16a34a, #22c55e);
      }

      .toast-error .toast-icon {
        background: linear-gradient(135deg, #dc2626, #ef4444);
      }

      .toast-content {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }

      .toast-content strong {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--color-secondary);
      }

      .toast-content span {
        font-size: 14px;
        color: var(--color-on-surface);
      }

      .toast-close {
        border: none;
        background: transparent;
        color: var(--color-secondary);
        font-size: 20px;
        cursor: pointer;
      }

      .hidden {
        display: none;
      }

      .dashboard-container {
        max-width: var(--container-width);
        margin: 0 auto;
      }

      .cms-header {
        text-align: center;
        margin-bottom: var(--spacing-xl);
      }

      .brand-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-sm);
        margin-bottom: var(--spacing-sm);
      }

      .brand-logo .material-symbols-outlined {
        color: var(--color-primary);
        font-variation-settings: "FILL" 1;
      }

      .brand-name {
        font-family: var(--font-display);
        font-size: 24px;
        font-weight: 700;
      }

      .brand-subtitle {
        font-size: 12px;
        color: var(--color-secondary);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-weight: 600;
      }

      /* Form section */
      .section-title {
        font-family: var(--font-display);
        font-size: 20px;
        margin-bottom: var(--spacing-md);
        font-weight: 600;
      }

      .cms-form {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .form-label {
        font-size: 14px;
        font-weight: 600;
      }

      .form-input,
      .form-textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--color-outline);
        border-radius: 2px;
        font-family: var(--font-body);
        font-size: 16px;
        background: white;
      }

      .form-input:focus,
      .form-textarea:focus {
        outline: 2px solid var(--color-primary);
        outline-offset: -1px;
      }

      .btn-submit {
        background: var(--color-primary);
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        align-self: flex-start;
        transition: background 0.2s ease;
      }

      .btn-submit:hover {
        background: var(--color-primary-hover);
      }

      .linkContainer .loginForm {
        text-decoration: none;
        padding: var(--spacing-sm);
      }

      .linkContainer {
        padding-top: var(--spacing-md);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div
      id="toastContainer"
      class="toast-container"
      aria-live="polite"
      aria-atomic="true"></div>
    <div class="dashboard-container">
      <!-- Branding -->
      <header class="cms-header">
        <div class="brand-logo">
          <span class="material-symbols-outlined">auto_stories</span>
          <h1 class="brand-name">The Narrative</h1>
        </div>
        <p class="brand-subtitle">Editorial CMS</p>
      </header>

      <section id="authSection">
        <h2 class="section-title">Sign Up</h2>
        <form id="regForm" class="cms-form">
          <div class="form-group">
            <label class="form-label" for="regName">Your Name</label>
            <input
              type="text"
              class="form-input"
              name="name"
              id="loginName"
              required
              placeholder="pls enter your name" />
            <label class="form-label" for="regEmail">Email Address</label>
            <input
              class="form-input"
              name="email"
              id="loginEmail"
              type="email"
              required
              placeholder="editor@thenarrative.com" />
          </div>
          <div class="form-group">
            <label class="form-label" for="regPassword">Password</label>
            <input
              class="form-input"
              name="password"
              id="loginPassword"
              type="password"
              required
              placeholder="••••••••" />
          </div>
          <button class="btn-submit" type="submit">Register</button>
        </form>
        <div class="linkContainer">
          <span>Have an Account?</span>
          <a href="index.html" class="loginForm"> • Login Here .</a>
        </div>
      </section>

      <section id="token" class="hidden">
        <form id="tokenForm" class="cms-form">
          <div class="form-group">
            <label class="form-label" for="tokenEmail">Email Address</label>
            <input
              class="form-input"
              id="tokenEmail"
              type="email"
              required
              placeholder="editor@thenarrative.com" />
          </div>
          <div class="form-group">
            <label class="form-label" for="regPassword">token</label>
            <input class="form-input" id="tokenPassword" type="text" require />
          </div>
          <button class="btn-submit" type="submit">Register</button>
        </form>
      </section>
    </div>
    <script>
      const form = document.getElementById("regForm");
      const authSection = document.getElementById("authSection");
      const tokenSection = document.getElementById("token");
      const tokenForm = document.getElementById("tokenForm");
      const loginName = document.getElementById("loginName");
      const loginEmail = document.getElementById("loginEmail");
      const loginPassword = document.getElementById("loginPassword");
      const tokenEmail = document.getElementById("tokenEmail");
      const tokenPassword = document.getElementById("tokenPassword");

      function showToast(message, type = "info") {
        const container = document.getElementById("toastContainer");
        if (!container) return;

        const toast = document.createElement("div");
        const normalizedType = ["success", "error", "info"].includes(type)
          ? type
          : "info";
        const labels = { success: "Success", error: "Error", info: "Notice" };
        const icons = { success: "✓", error: "✕", info: "i" };

        toast.className = `toast toast-${normalizedType}`;
        toast.innerHTML = `
          <div class="toast-icon">${icons[normalizedType]}</div>
          <div class="toast-content">
            <strong>${labels[normalizedType]}</strong>
            <span>${message}</span>
          </div>
          <button class="toast-close" type="button" aria-label="Close notification">×</button>
        `;

        const closeButton = toast.querySelector(".toast-close");
        closeButton.addEventListener("click", () => {
          toast.classList.remove("show");
          setTimeout(() => toast.remove(), 220);
        });

        container.appendChild(toast);
        requestAnimationFrame(() => toast.classList.add("show"));

        setTimeout(() => {
          toast.classList.remove("show");
          setTimeout(() => toast.remove(), 220);
        }, 3800);
      }

      const url = "/register";
      const tokenUrl = "/email/verification";

      //  form for Registering.
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          const name = loginName.value;
          const email = loginEmail.value;
          const password = loginPassword.value;

          console.log(name, email);

          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json", // <-- ADD THIS
            },
            body: JSON.stringify({
              name: name,
              email: email,
              password: password,
            }),
          });

          const data = await response.json();
          console.log("data: ", data);

          if (response.ok) {
            showToast(
              "Almost registered! Check your email for verification.",
              "success",
            );

            // prevent the user from retyping their email
            tokenEmail.value = email;

            authSection.classList.add("hidden");
            tokenSection.classList.remove("hidden");
          } else {
            showToast(
              data.error || "Something is wrong with the details entered.",
              "error",
            );
          }
        } catch (error) {
          showToast("Something went wrong while registering.", "error");
        }
      });

      // form for sending token to the email.
      tokenForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          // grab the form details
          const email = tokenEmail.value;
          const token = tokenPassword.value;

          if (!email || !token) {
            return;
          }

          const response = await fetch(tokenUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json", // <-- ADD THIS
            },
            body: JSON.stringify({ email: email, token: token }),
          });

          const data = await response;
          console.log(data);

          if (response.ok) {
            showToast(data.message || "Registration successful!", "success");
            window.location.href = "/index.html";
          } else {
            showToast(data.message || "Something went wrong.", "error");
          }
        } catch (error) {
          console.log(error);
        }
      });
    </script>
  </body>
</html>

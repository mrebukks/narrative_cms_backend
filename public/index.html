<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editorial CMS Dashboard</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Source+Serif+4:ital,wght@0,600;0,700;1,400&display=swap" />

    <script src="https://cdn.jsdelivr.net/npm/tinymce@7/tinymce.min.js"></script>

    <style>
      :root {
        /* Colors */
        --color-primary: #004ac6;
        --color-primary-hover: #003ea8;
        --color-secondary: #565e74;
        --color-on-surface: #191b23;
        --color-background: #faf8ff;
        --color-outline: #c3c6d7;
        --color-outline-variant: #e1e2ed;
        --color-error: #ba1a1a;

        /* Typography */
        --font-body: "Inter", sans-serif;
        --font-display: "Source Serif 4", serif;

        /* Spacing */
        --spacing-sm: 8px;
        --spacing-md: 16px;
        --spacing-lg: 32px;
        --spacing-xl: 48px;
        --container-width: 640px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--color-background);
        color: var(--color-on-surface);
        font-family: var(--font-body);
        line-height: 1.6;
        padding: var(--spacing-xl) var(--spacing-md);
      }

      .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 2000;
        padding: 0 16px;
      }

      .toast {
        min-width: 320px;
        max-width: 420px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow:
          0 8px 32px rgba(15, 23, 42, 0.12),
          inset 1px 1px 0 rgba(255, 255, 255, 0.5);
        border-left: 6px solid var(--color-primary);
        transform: translateX(30px);
        opacity: 0;
        transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
      }

      @media (max-width: 640px) {
        .toast-container {
          top: auto;
          bottom: 20px;
          right: 12px;
          left: 12px;
          gap: 10px;
          padding: 0;
        }

        .toast {
          min-width: unset;
          max-width: unset;
          width: 100%;
          padding: 12px 14px;
          border-radius: 14px;
          gap: 10px;
          font-size: 14px;
        }

        .toast-icon {
          width: 26px;
          height: 26px;
          font-size: 14px;
        }

        .toast-content strong {
          font-size: 10px;
        }

        .toast-content span {
          font-size: 13px;
        }

        .toast-close {
          font-size: 18px;
        }
      }

      .toast.show {
        transform: translateX(0);
        opacity: 1;
      }

      .toast-success {
        border-left-color: #1f9d61;
      }

      .toast-error {
        border-left-color: #d64545;
      }

      .toast-info {
        border-left-color: var(--color-primary);
      }

      .toast-icon {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 16px;
        color: white;
        background: linear-gradient(135deg, #1d4ed8, #2563eb);
        flex-shrink: 0;
      }

      .toast-success .toast-icon {
        background: linear-gradient(135deg, #16a34a, #22c55e);
      }

      .toast-error .toast-icon {
        background: linear-gradient(135deg, #dc2626, #ef4444);
      }

      .toast-info .toast-icon {
        background: linear-gradient(135deg, #1d4ed8, #2563eb);
      }

      .toast-content {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }

      .toast-content strong {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--color-secondary);
      }

      .toast-content span {
        font-size: 14px;
        line-height: 1.4;
        color: var(--color-on-surface);
      }

      .toast-close {
        border: none;
        background: transparent;
        color: var(--color-secondary);
        font-size: 20px;
        cursor: pointer;
        line-height: 1;
        padding: 0 2px;
      }

      .dashboard-container {
        max-width: var(--container-width);
        margin: 0 auto;
      }

      /* Header & Branding */
      .cms-header {
        text-align: center;
        margin-bottom: var(--spacing-xl);
      }

      .brand-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-sm);
        margin-bottom: var(--spacing-sm);
      }

      .brand-logo .material-symbols-outlined {
        color: var(--color-primary);
        font-variation-settings: "FILL" 1;
      }

      .brand-name {
        font-family: var(--font-display);
        font-size: 24px;
        font-weight: 700;
      }

      .brand-subtitle {
        font-size: 12px;
        color: var(--color-secondary);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-weight: 600;
      }

      /* Form Sections */
      .section-title {
        font-family: var(--font-display);
        font-size: 20px;
        margin-bottom: var(--spacing-md);
        font-weight: 600;
      }

      .cms-form {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .form-label {
        font-size: 14px;
        font-weight: 600;
      }

      .form-input,
      .form-textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--color-outline);
        border-radius: 2px;
        font-family: var(--font-body);
        font-size: 16px;
        background: white;
      }

      .form-input:focus,
      .form-textarea:focus {
        outline: 2px solid var(--color-primary);
        outline-offset: -1px;
      }

      .btn-submit {
        background: var(--color-primary);
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        align-self: flex-start;
        transition: background 0.2s ease;
      }

      .btn-submit:hover {
        background: var(--color-primary-hover);
      }

      /* Post List */
      .post-list-section {
        margin-top: var(--spacing-xl);
      }

      .post-list {
        list-style: none;
        border-top: 1px solid var(--color-outline);
      }

      .post-item {
        padding: var(--spacing-md) 0;
        border-bottom: 1px solid var(--color-outline-variant);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .post-info-title {
        display: block;
        font-weight: 600;
        font-size: 16px;
      }

      .post-info-meta {
        font-size: 12px;
        color: var(--color-secondary);
      }

      .post-actions {
        display: flex;
        gap: var(--spacing-md);
      }

      .post-actions a {
        text-decoration: none;
        font-size: 14px;
        font-weight: 400;
        color: var(--color-primary);
        cursor: pointer;
      }

      .post-actions a:hover {
        text-decoration: underline;
      }

      .post-actions a.delete {
        color: var(--color-error);
      }

      /* Footer */
      .cms-footer {
        margin-top: var(--spacing-xl);
        padding-top: var(--spacing-lg);
        border-top: 1px solid var(--color-outline);
        text-align: center;
      }

      .sign-out-link {
        color: var(--color-secondary);
        font-size: 12px;
        text-decoration: none;
        transition: color 0.2s ease;
        cursor: pointer;
      }

      .sign-out-link:hover {
        color: var(--color-primary);
      }

      /* Utility Helpers */
      .hidden {
        display: none !important;
      }

      .user-banner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: white;
        padding: var(--spacing-md);
        border: 1px solid var(--color-outline-variant);
        margin-bottom: var(--spacing-lg);
      }
    </style>
  </head>
  <body>
    <div
      id="toastContainer"
      class="toast-container"
      aria-live="polite"
      aria-atomic="true"></div>
    <div class="dashboard-container">
      <!-- Branding -->
      <header class="cms-header">
        <div class="brand-logo">
          <span class="material-symbols-outlined">auto_stories</span>
          <h1 class="brand-name">The Narrative</h1>
        </div>
        <p class="brand-subtitle">Editorial CMS</p>
      </header>

      <!-- 🔑 LOGIN SECTION (Visible when logged out) -->
      <section id="authSection">
        <h2 class="section-title">Editor Login</h2>
        <form id="loginForm" class="cms-form">
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address</label>
            <input
              class="form-input"
              id="loginEmail"
              type="email"
              required
              placeholder="editor@thenarrative.com" />
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <input
              class="form-input"
              id="loginPassword"
              type="password"
              required
              placeholder="••••••••" />
          </div>
          <button class="btn-submit" type="submit">Sign In to Dashboard</button>
        </form>
        <p>Not a User?</p>
        <a href="register.html">Register Here</a>
        <div>
          <p>Forgotten Passwords ?</p>
          <a href="forgotpassword.html"> click here</a>
        </div>
      </section>

      <!-- 👤 CMS DASHBOARD CONTENT (Hidden until authenticated) -->
      <main id="dashboardContent" class="hidden">
        <!-- Welcome Bar -->
        <div class="user-banner">
          <span id="welcomeText" class="form-label">Welcome, Editor</span>
          <a id="signOutBtn" class="sign-out-link">Sign Out</a>
        </div>

        <!-- Create / Edit Post Form -->
        <section>
          <h2 id="formHeading" class="section-title">Create New Post</h2>
          <form id="cmsForm" class="cms-form">
            <div class="form-group">
              <label class="form-label" for="title">Title</label>
              <input
                class="form-input"
                id="title"
                name="title"
                placeholder="Enter post title..."
                required
                type="text" />
            </div>

            <div class="form-group">
              <label class="form-label" for="image">Image</label>
              <input class="form-input" id="image" name="image" type="file" />
            </div>

            <div class="form-group">
              <label class="form-label" for="content">Content</label>
              <textarea
                class="form-textarea"
                id="content"
                name="content"
                placeholder="Write your story here..."
                required
                rows="6"></textarea>
            </div>

            <div class="form-group">
              <label class="form-label" for="content">Article</label>
              <textarea
                class="form-textarea"
                id="article"
                name="article"
                placeholder="Let's go with that powerful article of yours..."></textarea>
            </div>

            <button id="submitBtn" class="btn-submit" type="submit">
              Submit Post
            </button>
          </form>
        </section>

        <!-- Existing Posts Section -->
        <section class="post-list-section">
          <h2 class="section-title">Existing Posts</h2>
          <ul id="postList" class="post-list">
            <!-- Posts render dynamically here -->
          </ul>
        </section>

        <footer class="cms-footer">
          <p class="post-info-meta">
            Editorial Management System • Protected by JWT
          </p>
        </footer>
      </main>
    </div>

    <script>
      // TinyMcE code
      tinymce.init({
        selector: "#article",
        license_key: "gpl",
        branding: false,
        statusbar: false,
        height: 400,
        menubar: false,
        plugins: ["lists", "link", "image", "code", "autoresize"],
        toolbar:
          "undo redo | bold italic | h2 h3 | bullist numlist | link image | code",

        // Enable automatic uploading as soon as a file is picked
        automatic_uploads: true,

        // Add file picker types so TinyMCE knows to prioritize local files
        file_picker_types: "image",

        images_upload_handler: async (blobInfo) => {
          const formData = new FormData();
          formData.append("file", blobInfo.blob(), blobInfo.filename());

          const response = await fetch("/Upload-editorImage", {
            method: "POST",
            body: formData,
            credentials: "include",
          });

          if (!response.ok) {
            throw new Error(`Upload failed with status: ${response.status}`);
          }

          const data = await response.json();

          if (!data || !data.location) {
            throw new Error("Invalid response from server");
          }

          // Returning the string directly automatically resolves the promise for TinyMCE!
          return data.location;
        },

        // 📱 Mobile
        mobile: {
          menubar: false,
          toolbar_mode: "scrolling",
          toolbar:
            "undo redo | bold italic | h2 h3 | bullist numlist | link | link image ",
        },

        // Prevents iPhone Safari auto-zoom on focus
        content_style:
          "body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; margin: 12px; }",
      });

      function showToast(message, type = "info") {
        const container = document.getElementById("toastContainer");
        if (!container) return;

        const toast = document.createElement("div");
        const normalizedType = ["success", "error", "info"].includes(type)
          ? type
          : "info";
        const labels = {
          success: "Success",
          error: "Error",
          info: "Notice",
        };
        const icons = {
          success: "✓",
          error: "✕",
          info: "i",
        };

        toast.className = `toast toast-${normalizedType}`;
        toast.innerHTML = `
          <div class="toast-icon">${icons[normalizedType]}</div>
          <div class="toast-content">
            <strong>${labels[normalizedType]}</strong>
            <span>${message}</span>
          </div>
          <button class="toast-close" type="button" aria-label="Close notification">×</button>
        `;

        const closeButton = toast.querySelector(".toast-close");
        closeButton.addEventListener("click", () => {
          toast.classList.remove("show");
          setTimeout(() => toast.remove(), 220);
        });

        container.appendChild(toast);
        requestAnimationFrame(() => toast.classList.add("show"));

        setTimeout(() => {
          toast.classList.remove("show");
          setTimeout(() => toast.remove(), 220);
        }, 3800);
      }

      // Api routes
      const API_URL = "/posts";
      const postURL = "/post";
      const AUTH_URL = "/login";
      const API_URL_Me = "/post/me";
      const AUTH_URL_Logout = "/logout";

      // URL Title Variable
      // State Trackers old way
      // let authToken = localStorage.getItem("cms_jwt_token") || null;
      // let currentEditingId = null;

      // NEW WAY:
      let userProfile =
        JSON.parse(localStorage.getItem("cms_user_profile")) || null;
      let currentEditingId = null;

      // DOM Elements
      const authSection = document.getElementById("authSection");
      const dashboardContent = document.getElementById("dashboardContent");
      const loginForm = document.getElementById("loginForm");
      const cmsForm = document.getElementById("cmsForm");
      const postList = document.getElementById("postList");
      const welcomeText = document.getElementById("welcomeText");
      const signOutBtn = document.getElementById("signOutBtn");
      const submitBtn = document.getElementById("submitBtn");
      const formHeading = document.getElementById("formHeading");

      // 🔄 2. Toggle UI based on Login State
      function updateAuthUI() {
        userProfile = JSON.parse(localStorage.getItem("cms_user_profile"));
        if (userProfile) {
          welcomeText.textContent = `Welcome, ${userProfile.name} --- Badge: ${userProfile.role}`;
          authSection.classList.add("hidden");
          dashboardContent.classList.remove("hidden");
          fetchPosts(); // Load database posts when logged in
        } else {
          authSection.classList.remove("hidden");
          dashboardContent.classList.add("hidden");
        }
      }

      // 🔑 3. Login Handler
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        try {
          const response = await fetch(AUTH_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();
          console.log(data);

          if (response.ok) {
            // The browser has already silently accepted and locked away the cookie!
            // We just save the harmless profile info to drive the UI layout.
            localStorage.setItem("cms_user_profile", JSON.stringify(data.user));

            updateAuthUI();
            showToast("Login successful.", "success");
          } else {
            showToast(data.error || "Unauthorized", "error");
          }
        } catch (error) {
          console.error("Login error:", error);
          showToast("Unable to connect to the authentication server.", "error");
        }
      });

      // 🚪 4. Sign Out Handler
      signOutBtn.addEventListener("click", async (e) => {
        e.preventDefault();
        localStorage.removeItem("cms_user_profile");
        updateAuthUI();
        await fetch(AUTH_URL_Logout, {
          method: "POST",
          credentials: "include",
        });
      });

      // 📬 5. Fetch and Render Posts
      async function fetchPosts() {
        try {
          const response = await fetch(`${API_URL_Me}`, {
            method: "GET",
            credentials: "include",
          });

          if (!response.ok) {
            console.error("fetchPosts failed", response.status);
            localStorage.removeItem("cms_user_profile");
            updateAuthUI();
            return;
          }

          const data = await response.json();
          const posts = data.posts || [];

          console.log("from fetchPosts", data);

          postList.innerHTML = "";

          if (posts.length === 0) {
            postList.innerHTML =
              '<li class="post-item"><span class="post-info-meta">No existing posts found in the database.</span></li>';
            return;
          }

          posts.forEach((post) => {
            const formattedDate = new Date(post.createdAt).toLocaleDateString(
              "en-US",
              {
                month: "short",
                day: "numeric",
                year: "numeric",
              },
            );

            const postHTML = `
                  <li class="post-item">
                    <div class="post-info">
                      <span class="post-info-title">${post.title}</span>
                      <p class="post-info-meta">${formattedDate} • Published</p>
                    </div>
                    <div class="post-actions">
                      <a onclick="startEditing(${post.id})">Edit</a>
                      <a class="delete" onclick="deletePost(${post.id})">Delete</a>
                    </div>
                  </li>
                `;
            postList.insertAdjacentHTML("beforeend", postHTML);
          });
        } catch (error) {
          console.error("Error fetching posts:", error);
        }
      }

      // 📝 6. Create or Edit Post Submit Handler
      cmsForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        // 1. Force TinyMCE to sync with your form before reading
        if (window.tinymce) {
          tinymce.triggerSave();
        }

        const titleValue = document.getElementById("title").value;
        const contentValue = document.getElementById("content").value;
        const articleHTML = tinymce.get("article").getContent();
        const imageFileInput = document.getElementById("image").files[0];

        if (!articleHTML || articleHTML.trim() === "") {
          showToast("Please write your article before submitting!", "error");
          return;
        }

        const formData = new FormData();
        formData.append("title", titleValue);
        formData.append("content", contentValue);
        formData.append("article", articleHTML);
        if (imageFileInput) {
          formData.append("image", imageFileInput);
        }

        const isEditing = currentEditingId !== null;
        const url = isEditing ? `${postURL}/${currentEditingId}` : postURL;
        const method = isEditing ? "PUT" : "POST";
        console.log(url, method);

        // Validate that the user actually wrote something
        if (!articleHTML.trim()) {
          showToast(
            "Please write something in your article before submitting!",
            "error",
          );
          return;
        }

        try {
          const response = await fetch(url, {
            method: method,
            credentials: "include",
            body: formData,
            mode: "cors",
          });

          if (response.ok) {
            showToast(
              isEditing
                ? "Post updated successfully."
                : "Post published successfully.",
              "success",
            );
            cmsForm.reset();
            tinymce.get("article").setContent("");
            currentEditingId = null;
            submitBtn.textContent = "Submit Post";
            formHeading.textContent = "Create New Post";
            fetchPosts();
          } else {
            const contentType = response.headers.get("content-type");
            if (contentType && contentType.includes("application/json")) {
              const data = await response.json();
              showToast(data.error || "Unauthorized", "error");
            } else {
              const errorText = await response.text();
              showToast(
                `Action failed (${response.status}): ${errorText || "Server error"}`,
                "error",
              );
            }
          }
        } catch (error) {
          console.error("Submission error:", error);
        }
      });

      // ✏️ 7. Edit Handler
      async function startEditing(postId) {
        // get the particular post using the postId
        try {
          const response = await fetch(`${postURL}/${postId}`, {
            method: "GET",
            credentials: "include",
          });

          if (!response.ok) {
            console.error("Failed to load post for editing", response.status);
            return;
          }

          const post = await response.json();
          document.getElementById("title").value = post.title;
          document.getElementById("content").value = post.content;
          tinymce.get("article").setContent(post.article || "");

          currentEditingId = postId;

          submitBtn.textContent = "Update Post";
          formHeading.textContent = "Edit Post";
          cmsForm.scrollIntoView({ behavior: "smooth" });
        } catch (error) {
          console.error("Error loading post:", error);
        }
      }

      // 🗑️ 8. Delete Handler
      async function deletePost(postId) {
        const confirmDelete = () => {
          const overlay = document.createElement("div");
          overlay.className = "toast-container";
          overlay.style.position = "fixed";
          overlay.style.inset = "0";
          overlay.style.display = "grid";
          overlay.style.placeItems = "center";
          overlay.style.background = "rgba(15, 23, 42, 0.32)";
          overlay.style.zIndex = "3000";

          const modal = document.createElement("div");
          modal.style.width = "min(420px, calc(100vw - 32px))";
          modal.style.background = "white";
          modal.style.borderRadius = "18px";
          modal.style.padding = "24px";
          modal.style.boxShadow = "0 24px 55px rgba(15, 23, 42, 0.24)";
          modal.style.border = "1px solid rgba(15, 23, 42, 0.08)";

          modal.innerHTML = `
            <div style="display:flex;flex-direction:column;gap:12px;">
              <div style="display:flex;align-items:center;gap:12px;">
                <div style="width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#dc2626,#ef4444);color:white;font-weight:700;">!</div>
                <div style="font-size:18px;font-weight:700;color:#191b23;">Delete story?</div>
              </div>
              <p style="font-size:14px;color:#565e74;line-height:1.6;">This action is permanent and cannot be undone.</p>
              <div style="display:flex;justify-content:flex-end;gap:12px;margin-top:8px;">
                <button type="button" class="cancel-delete" style="border:none;background:#eef2ff;color:#1f2937;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;">Cancel</button>
                <button type="button" class="confirm-delete" style="border:none;background:linear-gradient(135deg,#dc2626,#ef4444);color:white;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;">Delete</button>
              </div>
            </div>
          `;

          overlay.appendChild(modal);
          document.body.appendChild(overlay);

          modal
            .querySelector(".cancel-delete")
            .addEventListener("click", () => {
              overlay.remove();
            });

          modal
            .querySelector(".confirm-delete")
            .addEventListener("click", async () => {
              overlay.remove();
              try {
                const response = await fetch(`${postURL}/${postId}`, {
                  method: "DELETE",
                  credentials: "include",
                });

                const data = await response.json();

                if (response.ok) {
                  fetchPosts();
                  showToast("Story deleted successfully.", "success");
                } else if (response.status === 403 || response.status === 401) {
                  showToast(data.error || "Unauthorized", "error");
                } else {
                  showToast(
                    "Unauthorized or server error deleting post.",
                    "error",
                  );
                }
              } catch (error) {
                console.error("Delete error:", error);
                showToast("Could not delete this post right now.", "error");
              }
            });
        };

        confirmDelete();
      }

      // Initialize UI check on page load
      updateAuthUI();
    </script>
  </body>
</html>

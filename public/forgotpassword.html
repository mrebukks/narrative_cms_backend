<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgotten Password</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Source+Serif+4:ital,wght@0,600;0,700;1,400&display=swap" />

    <style>
      :root {
        /* Colors */
        --color-primary: #004ac6;
        --color-primary-hover: #003ea8;
        --color-secondary: #565e74;
        --color-on-surface: #191b23;
        --color-background: #faf8ff;
        --color-outline: #c3c6d7;
        --color-outline-variant: #e1e2ed;
        --color-error: #ba1a1a;

        /* Typography */
        --font-body: "Inter", sans-serif;
        --font-display: "Source Serif 4", serif;

        /* Spacing */
        --spacing-sm: 8px;
        --spacing-md: 16px;
        --spacing-lg: 32px;
        --spacing-xl: 48px;
        --container-width: 640px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--color-background);
        color: var(--color-on-surface);
        font-family: var(--font-body);
        line-height: 1.6;
        padding: var(--spacing-xl) var(--spacing-md);
        max-width: var(--container-width);
        margin: 0 auto;
      }

      /* Header & Branding */
      .cms-header {
        text-align: center;
        margin-bottom: var(--spacing-xl);
      }

      .brand-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-sm);
        margin-bottom: var(--spacing-sm);
      }

      .brand-logo .material-symbols-outlined {
        color: var(--color-primary);
        font-variation-settings: "FILL" 1;
      }

      .brand-name {
        font-family: var(--font-display);
        font-size: 24px;
        font-weight: 700;
      }

      .brand-subtitle {
        font-size: 12px;
        color: var(--color-secondary);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-weight: 600;
      }

      /* Form Sections */
      .section-title {
        font-family: var(--font-display);
        font-size: 20px;
        margin-bottom: var(--spacing-md);
        font-weight: 600;
      }

      .cms-form {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-md);
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .form-label {
        font-size: 14px;
        font-weight: 600;
      }

      .form-input,
      .form-textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--color-outline);
        border-radius: 2px;
        font-family: var(--font-body);
        font-size: 16px;
        background: white;
      }

      .form-input:focus,
      .form-textarea:focus {
        outline: 2px solid var(--color-primary);
        outline-offset: -1px;
      }

      .btn-submit {
        background: var(--color-primary);
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        align-self: flex-start;
        transition: background 0.2s ease;
      }

      .btn-submit:hover {
        background: var(--color-primary-hover);
      }

      .hidden {
        display: none;
      }

      .timer {
        color: red;
        padding-top: var(--spacing-sm);
      }
    </style>
  </head>
  <body>

    <section id="token" class="hidden">
      <form id="tokenForm" class="cms-form">
        <div class="form-group">
          <label class="form-label" for="tokenEmail">Email Address</label>
          <input
            class="form-input"
            id="tokenEmail"
            type="email"
            required
            placeholder="editor@thenarrative.com" />
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">token</label>
          <input class="form-input" id="tokenPassword" type="text" require />
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">New Password</label>
          <input
            class="form-input"
            id="newPassword"
            type="password"
            required
            placeholder="••••••••" />
          <button class="btn-submit" type="submit">Register</button>
        </div>
      </form>
    </section>

    <section id="forgotPassword">
      <h2>Enter your Email to recieve verification token</h2>
      <form id="forgotPassForm" class="cms-form">
        <label for="email" class="form-label">Email</label>
        <input
          type="email"
          id="forgotEmail"
          class="form-input"
          placeholder="Enter your registered Email"
          require />
        <button type="submit" class="btn-submit" id="btnVerify">Send</button>
      </form>
    </section>

    <section id="timer">
      <div class="timer"></div>
    </section>

    <script>
      // General
      const authSection = document.getElementById("authSection");
      const tokenSection = document.getElementById("token");
      const form = document.getElementById("loginForm");
      const loginEmail = document.getElementById("loginEmail");

      // token side
      const tokenForm = document.getElementById("tokenForm");
      const tokenEmail = document.getElementById("tokenEmail");
      const tokenPassword = document.getElementById("tokenPassword");
      const password = document.getElementById("newPassword");

      // Form only for sending that email.
      const forgotPasswordSect = document.getElementById("forgotPassword");
      const forgotPasswordForm = document.getElementById("forgotPassForm");
      const forgotEmail = document.getElementById("forgotEmail");
      const btnVerify = document.getElementById("btnVerify");

      // timer
      const timerSection = document.getElementById("timer");
      const timerContainer = document.querySelector(".timer");

      // URL's
      const verify_email = "/forgot-password";
      const update_Password = "/reset-password";

      // Action
      // Only for email verification
      ////////////////////////////////////////
      forgotPasswordForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        // disable button to prevent multiple submissions.
        btnVerify.disabled = true;

        try {
          // grab the email.
          const email = forgotEmail.value;

          // send the response to the server
          const response = await fetch(verify_email, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            credentials: "include",
            body: JSON.stringify({ email: email }),
          });

          const data = await response.json();

          if (response.ok) {
            alert("Check your email for verification");
            forgotPasswordSect.classList.add("hidden");
            tokenEmail.value = email;
            tokenSection.classList.remove("hidden");
            // duration for timer.
            let duration = data.expiry;
            console.log("Token expires at:", duration);

            // passing the data to timer.
            startCountdown(duration);
          } else {
            btnVerify.disabled = false;
            alert(data.message || "Failed to send to this Email");
          }
        } catch (error) {
          console.log(error);
        }
      });

      ////////////////////////////////////////////////////////////////
      tokenForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        try {
          // input the email and the token.
          const email = tokenEmail.value;
          const token = tokenPassword.value;
          const newPassword = password.value;

          // Send details to the server.
          const response = await fetch(update_Password, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            credentials: "include",
            body: JSON.stringify({
              email: email,
              token: token,
              newPassword: newPassword,
            }),
          });

          const data = await response.json();

          if (response.ok) {
            alert("Your Password has been Updated");
            tokenSection.classList.add("hidden");
            window.location.href = "/index.html";
          } else {
            alert(data.message || "Failed to send to this Email");
          }
        } catch (error) {
          console.log(error);
        }
      });

      //////////////////////////////////////////////////////////
      // ==========================================
      // THE FIXED RECURSIVE TIMER
      // ==========================================
      function startCountdown(expiryTimestamp) {
        // 1. Calculate how many milliseconds are left from right now
        let timerDiff = expiryTimestamp - Date.now();

        // 2. Safe exit condition if time runs out
        if (timerDiff <= 0) {
          timerContainer.textContent = "00:00";
          return;
        }

        // 3. Convert remaining milliseconds to minutes and seconds
        let minutes = Math.floor(timerDiff / (1000 * 60));
        let seconds = Math.round((timerDiff % (1000 * 60)) / 1000);

        // 4. Handle boundary roll-over (if round pushes seconds to 60)
        if (seconds === 60) {
          minutes += 1;
          seconds = 0;
        }

        // 5. Format to 2 digits
        const mins = String(minutes).padStart(2, "0");
        const secs = String(seconds).padStart(2, "0");

        // 6. Overwrite the container text
        timerContainer.textContent = mins + ":" + secs;

        // 7. Loop safely using your preferred native passing syntax
        setTimeout(startCountdown, 1000, expiryTimestamp);
      }
    </script>
  </body>
</html>
